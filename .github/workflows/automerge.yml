name: Agentic PR Verify and Merge (M4)

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to verify and merge"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: automerge-pr-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  verify-and-merge:
    # Public repo safety: only run on the self-hosted M4 runner when explicitly triggered
    # by sethwebster on a non-draft same-repo PR targeting main.
    if: >-
      (
        github.event_name == 'pull_request' &&
        github.event.label.name == 'automerge' &&
        github.actor == 'sethwebster' &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.base.ref == 'main' &&
        github.event.pull_request.head.repo.full_name == github.repository
      ) || (
        github.event_name == 'workflow_dispatch' &&
        github.actor == 'sethwebster'
      )
    runs-on: [self-hosted, macOS, ARM64, float]
    timeout-minutes: 25

    steps:
      - name: Resolve PR metadata and auth
        id: pr
        env:
          FALLBACK_TOKEN: ${{ github.token }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          INPUT_PR: ${{ inputs.pr_number }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$HOME/.asdf/shims:$HOME/.cargo/bin:$HOME/.bun/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"

          PR_NUM="${EVENT_PR:-$INPUT_PR}"
          [[ "$PR_NUM" =~ ^[0-9]+$ ]] || { echo "::error::Invalid PR number: $PR_NUM"; exit 1; }

          # Prefer the M4's sethwebster gh token so squash-merge triggers release.yml on main
          # (merges authenticated with GITHUB_TOKEN suppress downstream push workflows).
          TOKEN=""
          if TOKEN="$(gh auth token -u sethwebster 2>/dev/null)" && [[ -n "$TOKEN" ]]; then
            echo "::add-mask::$TOKEN"
            echo "using_user_token=true" >> "$GITHUB_OUTPUT"
          else
            TOKEN="$FALLBACK_TOKEN"
            echo "using_user_token=false" >> "$GITHUB_OUTPUT"
          fi
          export GH_TOKEN="$TOKEN"

          PR_JSON="$(gh pr view "$PR_NUM" -R "$GITHUB_REPOSITORY" --json state,isDraft,baseRefName,headRefName,headRefOid,headRepository,labels)"
          STATE="$(printf '%s' "$PR_JSON" | jq -r '.state')"
          IS_DRAFT="$(printf '%s' "$PR_JSON" | jq -r '.isDraft')"
          BASE_REF="$(printf '%s' "$PR_JSON" | jq -r '.baseRefName')"
          HEAD_REF="$(printf '%s' "$PR_JSON" | jq -r '.headRefName')"
          HEAD_OID="$(printf '%s' "$PR_JSON" | jq -r '.headRefOid')"
          HEAD_REPO="$(printf '%s' "$PR_JSON" | jq -r '.headRepository.nameWithOwner')"
          HAS_LABEL="$(printf '%s' "$PR_JSON" | jq -r '[.labels[].name] | index("automerge") != null')"

          [[ "$STATE" == "OPEN" ]] || { echo "::error::PR #$PR_NUM is not open ($STATE)"; exit 1; }
          [[ "$IS_DRAFT" == "false" ]] || { echo "::error::PR #$PR_NUM is a draft"; exit 1; }
          [[ "$BASE_REF" == "main" ]] || { echo "::error::PR #$PR_NUM targets $BASE_REF, expected main"; exit 1; }
          [[ "$HEAD_REPO" == "$GITHUB_REPOSITORY" ]] || { echo "::error::Refusing external fork PR ($HEAD_REPO)"; exit 1; }
          if [[ "$EVENT_NAME" == "pull_request" && "$HAS_LABEL" != "true" ]]; then
            echo "::error::automerge label was removed before run started"
            exit 1
          fi

          {
            echo "number=$PR_NUM"
            echo "head_ref=$HEAD_REF"
            echo "head_oid=$HEAD_OID"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.pr.outputs.head_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Update local Exact checkout to latest main
        id: exact
        env:
          EXACT2: ${{ env.EXACT2 || '/Users/sethwebster/Development/exact2-main' }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$HOME/.asdf/shims:$HOME/.cargo/bin:$HOME/.bun/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"
          git -C "$EXACT2" -c filter.lfs.process= -c filter.lfs.clean= -c filter.lfs.smudge= -c filter.lfs.required=false fetch origin main
          git -C "$EXACT2" -c filter.lfs.process= -c filter.lfs.clean= -c filter.lfs.smudge= -c filter.lfs.required=false reset --hard origin/main
          (cd "$EXACT2" && bun install --frozen-lockfile)
          EXACT_SHA="$(git -C "$EXACT2" rev-parse --short HEAD)"
          echo "EXACT2=$EXACT2" >> "$GITHUB_ENV"
          echo "sha=$EXACT_SHA" >> "$GITHUB_OUTPUT"
          echo "Exact2 main at $EXACT_SHA"

      - name: Verify against latest Exact, build, and test (with agentic repair on drift)
        id: verify
        env:
          FALLBACK_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
          EXACT_SHA: ${{ steps.exact.outputs.sha }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$HOME/.asdf/shims:$HOME/.cargo/bin:$HOME/.bun/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"
          if [[ -z "${CARGO_HOME:-}" && ! -d "$HOME/.cargo/hermes-lean-sys" && -d "$HOME/.asdf/installs/rust/stable/hermes-lean-sys" ]]; then
            export CARGO_HOME="$HOME/.asdf/installs/rust/stable"
          fi

          run_checks() {
            local log="$1"
            : > "$log"
            echo "=== bun exact.mjs test web ===" | tee -a "$log"
            bun exact.mjs test web 2>&1 | tee -a "$log"
            echo "=== bun exact.mjs test macos ===" | tee -a "$log"
            bun exact.mjs test macos 2>&1 | tee -a "$log"
            echo "=== ./build.sh (ad-hoc verify) ===" | tee -a "$log"
            SIGN=- EXACT_IDENTITY=- ./build.sh 2>&1 | tee -a "$log"
          }

          LOG_FILE="$RUNNER_TEMP/float-verify.log"
          AGENT_FIXED="false"

          if ! run_checks "$LOG_FILE"; then
            echo "Initial verification against Exact $EXACT_SHA failed; invoking agentic repair..."
            TAIL_LOG="$(tail -n 160 "$LOG_FILE")"
            REPAIR_PROMPT="$(cat <<EOF
          Float PR #$PR_NUMBER failed verification against latest Exact2 main ($EXACT_SHA) at $EXACT2.
          Diagnose and fix the compatibility or test/build failure in this repository so that:
          1. \`bun exact.mjs test web\` passes
          2. \`bun exact.mjs test macos\` passes
          3. \`SIGN=- EXACT_IDENTITY=- ./build.sh\` succeeds

          Rules:
          - Do NOT modify anything inside $EXACT2.
          - Do NOT commit or push; leave your edits in the working tree for independent verification.
          - NEVER include any AI attribution anywhere in code, comments, or docs.

          Recent failure output:
          $TAIL_LOG
          EOF
          )"

            if command -v claude >/dev/null 2>&1; then
              claude -p "$REPAIR_PROMPT" --dangerously-skip-permissions
            elif command -v codex >/dev/null 2>&1; then
              codex exec --full-auto "$REPAIR_PROMPT"
            else
              echo "::error::No agent CLI (claude or codex) found for repair"
              exit 1
            fi

            # Independently re-verify after agent edits
            run_checks "$LOG_FILE"

            if [[ -n "$(git status --porcelain)" ]]; then
              AGENT_FIXED="true"
              git config user.name "Seth Webster"
              git config user.email "sethwebster@users.noreply.github.com"
              git add -A
              if git diff --cached | grep -qiE "claude|anthropic|co-authored-by|generated with"; then
                echo "::error::Refusing commit containing attribution string"
                exit 1
              fi
              git commit -m "fix: update Float for Exact $EXACT_SHA compatibility"

              TOKEN=""
              if TOKEN="$(gh auth token -u sethwebster 2>/dev/null)" && [[ -n "$TOKEN" ]]; then
                echo "::add-mask::$TOKEN"
              else
                TOKEN="$FALLBACK_TOKEN"
              fi
              git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64)" \
                push origin "HEAD:refs/heads/$HEAD_REF"
            fi
          fi

          echo "agent_fixed=$AGENT_FIXED" >> "$GITHUB_OUTPUT"
          echo "verified_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Comment results and squash-merge PR
        env:
          FALLBACK_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          EXACT_SHA: ${{ steps.exact.outputs.sha }}
          AGENT_FIXED: ${{ steps.verify.outputs.agent_fixed }}
          VERIFIED_SHA: ${{ steps.verify.outputs.verified_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$HOME/.asdf/shims:$HOME/.cargo/bin:$HOME/.bun/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"

          TOKEN=""
          if TOKEN="$(gh auth token -u sethwebster 2>/dev/null)" && [[ -n "$TOKEN" ]]; then
            echo "::add-mask::$TOKEN"
          else
            TOKEN="$FALLBACK_TOKEN"
          fi
          export GH_TOKEN="$TOKEN"

          CURRENT_OID="$(gh pr view "$PR_NUMBER" -R "$GITHUB_REPOSITORY" --json headRefOid --jq '.headRefOid')"
          if [[ "$CURRENT_OID" != "$VERIFIED_SHA" ]]; then
            echo "::error::PR head moved during verification ($VERIFIED_SHA -> $CURRENT_OID); aborting merge"
            exit 1
          fi

          FIX_NOTE=""
          if [[ "$AGENT_FIXED" == "true" ]]; then
            FIX_NOTE="- Applied and pushed an automatic Exact \`$EXACT_SHA\` compatibility fix (\`${VERIFIED_SHA:0:7}\`)"
          fi

          gh pr comment "$PR_NUMBER" -R "$GITHUB_REPOSITORY" --body "$(cat <<EOF
          Verified on M4 against Exact \`$EXACT_SHA\` ([workflow run]($RUN_URL)):
          - \`bun exact.mjs test web\` passed
          - \`bun exact.mjs test macos\` passed
          - \`./build.sh\` built \`build/Float.app\` cleanly
          $FIX_NOTE
          Merging to \`main\` now.
          EOF
          )"

          gh pr merge "$PR_NUMBER" -R "$GITHUB_REPOSITORY" --squash --delete-branch --match-head-commit "$VERIFIED_SHA"

      - name: Report failure and remove automerge label
        if: failure() && steps.pr.outputs.number != ''
        env:
          FALLBACK_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$HOME/.asdf/shims:$HOME/.cargo/bin:$HOME/.bun/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"
          TOKEN=""
          if TOKEN="$(gh auth token -u sethwebster 2>/dev/null)" && [[ -n "$TOKEN" ]]; then
            echo "::add-mask::$TOKEN"
          else
            TOKEN="$FALLBACK_TOKEN"
          fi
          export GH_TOKEN="$TOKEN"
          gh pr edit "$PR_NUMBER" -R "$GITHUB_REPOSITORY" --remove-label automerge || true
          gh pr comment "$PR_NUMBER" -R "$GITHUB_REPOSITORY" --body "M4 verification/merge failed ([workflow run]($RUN_URL)). Removed the \`automerge\` label." || true
