name: Build and publish updates

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: sparkle-publication
  cancel-in-progress: false

jobs:
  publish:
    # Self-hosted M4 runner (main only — repo is public, never run untrusted PRs on self-hosted)
    runs-on: [self-hosted, macOS, ARM64, float]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # semantic-release and publish-appcast.sh authenticate explicitly.
          persist-credentials: false
      - name: Update local Exact checkout
        env:
          EXACT: ${{ env.EXACT || '/Users/sethwebster/Development/exact' }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$HOME/.asdf/shims:$HOME/.bun/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"
          EXACT_REPO="git@github.com:expo/exact.git"
          if [[ ! -d "$EXACT/.git" ]]; then
            git clone -c filter.lfs.process= -c filter.lfs.clean= -c filter.lfs.smudge= -c filter.lfs.required=false --depth 1 "$EXACT_REPO" "$EXACT"
          else
            git -C "$EXACT" remote set-url origin "$EXACT_REPO"
            git -C "$EXACT" -c filter.lfs.process= -c filter.lfs.clean= -c filter.lfs.smudge= -c filter.lfs.required=false fetch origin main
            git -C "$EXACT" -c filter.lfs.process= -c filter.lfs.clean= -c filter.lfs.smudge= -c filter.lfs.required=false reset --hard origin/main
          fi
          (cd "$EXACT" && rustc --version && bun install --frozen-lockfile)
          if [[ -z "${RUSTUP_HOME:-}" ]] && command -v rustup >/dev/null 2>&1; then
            RUSTUP_HOME="$(cd "$EXACT" && rustup show home)"
            echo "RUSTUP_HOME=$RUSTUP_HOME" >> "$GITHUB_ENV"
          fi
          echo "EXACT=$EXACT" >> "$GITHUB_ENV"
          echo "EXACT2=$EXACT" >> "$GITHUB_ENV"
      # GitHub release downloads 504 for minutes at a time; build.sh only fetches Sparkle on a miss.
      - uses: actions/cache@v4
        with:
          path: .vendor
          key: sparkle-${{ hashFiles('updates.env') }}
      - name: Import Developer ID certificate
        env:
          CERTIFICATE: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.BUILD_KEYCHAIN_PASSWORD }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_KEY_ISSUER: ${{ secrets.NOTARY_KEY_ISSUER }}
        run: |
          set -euo pipefail
          for name in CERTIFICATE CERTIFICATE_PASSWORD KEYCHAIN_PASSWORD NOTARY_KEY NOTARY_KEY_ID NOTARY_KEY_ISSUER; do
            [ -n "${!name}" ] || { echo "::error::secret for $name is not set"; exit 1; }
          done
          cert="$RUNNER_TEMP/developer-id.p12"; keychain="$RUNNER_TEMP/float.keychain-db"
          security delete-keychain "$keychain" 2>/dev/null || true
          umask 077; printf '%s' "$CERTIFICATE" | base64 -D > "$cert"
          printf '%s' "$NOTARY_KEY" > "$RUNNER_TEMP/notary.p8"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$cert" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$keychain" >/dev/null
          # Isolate the unlocked temporary build keychain during release signing so codesign
          # does not hit an ambiguous-identity conflict with the runner's login keychain,
          # and set it as default so `xcrun notarytool` reads `exact-notary` without hitting
          # a locked login keychain in headless LaunchAgent sessions.
          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"
          xcrun notarytool store-credentials exact-notary \
            --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_KEY_ISSUER" \
            --keychain "$keychain"
      - name: Preflight checks
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.BUILD_KEYCHAIN_PASSWORD }}
          SIGN: ${{ secrets.DEVELOPER_ID_APPLICATION }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$HOME/.asdf/shims:$HOME/.bun/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"
          keychain="$RUNNER_TEMP/float.keychain-db"
          failed=0
          
          # Check Rust toolchain availability (Exact builds with Rust)
          if ! command -v cargo >/dev/null 2>&1; then
            echo "::error::cargo not found — Exact requires Rust. Install via 'rustup-init' or 'brew install rust'."
            failed=1
          else
            rust_version=$(rustc --version 2>&1 | awk '{print $2}')
            echo "Found Rust toolchain: $rust_version"
            # Verify rustc can compile (guards against incomplete/broken installations)
            if ! rustc --version >/dev/null 2>&1; then
              echo "::error::rustc is present but not functional. Reinstall the Rust toolchain."
              failed=1
            fi
            # Read the pinned version from Exact's rust-toolchain.toml if available
            if [[ -f "$EXACT/rust-toolchain.toml" ]]; then
              required=$(awk -F'"' '/^channel = / {print $2}' "$EXACT/rust-toolchain.toml")
              if [[ -n $required && $rust_version != "$required" ]]; then
                echo "::warning::Rust $rust_version found, but Exact pins $required. Run 'rustup install $required && rustup default $required'."
              fi
            fi
          fi
          
          # Check build keychain state
          if [[ ! -f "$keychain" ]]; then
            echo "::error::Build keychain does not exist at $keychain — certificate import step may have failed."
            failed=1
          else
            # Verify keychain is unlocked (security unlock-keychain exits 0 even if already unlocked)
            if ! security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain" >/dev/null 2>&1; then
              echo "::error::Build keychain exists but cannot be unlocked. Check KEYCHAIN_PASSWORD secret."
              failed=1
            else
              echo "Build keychain is unlocked."
              # Verify signing identity is present and valid
              if ! security find-identity -v -p codesigning "$keychain" 2>/dev/null | grep -qF "$SIGN"; then
                echo "::error::Signing identity '$SIGN' not found in build keychain. Certificate import may have failed."
                failed=1
              else
                echo "Signing identity '$SIGN' found in keychain."
              fi
            fi
          fi
          
          if [[ $failed -eq 1 ]]; then
            echo "::error::Preflight checks failed. Fix the runner environment before retrying."
            exit 1
          fi
          echo "Preflight checks passed."
      - name: Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Only increases. Renaming this file resets it, so don't.
          FLOAT_BUILD_NUMBER: ${{ github.run_number }}
          SIGN: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          EXACT_NOTARY_PROFILE: exact-notary
          KEYCHAIN_PASSWORD: ${{ secrets.BUILD_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$HOME/.asdf/shims:$HOME/.bun/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"
          keychain="$RUNNER_TEMP/float.keychain-db"
          for name in SIGN SPARKLE_PRIVATE_KEY; do
            [ -n "${!name}" ] || { echo "::error::secret for $name is not set"; exit 1; }
          done
          
          # Re-unlock build keychain before signing to guard against timeout locks
          # (macOS may lock keychains after inactivity even with extended timeout settings)
          if [[ -f "$keychain" ]]; then
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
            security set-keychain-settings -lut 21600 "$keychain"
            echo "Build keychain re-unlocked before release signing."
          fi
          
          mkdir -p .exact
          ln -sfn "$EXACT" .exact/checkout
          npm ci --no-audit --no-fund
          npx semantic-release
      - name: Remove temporary credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/notary.p8"
          security delete-keychain "$RUNNER_TEMP/float.keychain-db" 2>/dev/null || true
          security default-keychain -d user -s "$HOME/Library/Keychains/login.keychain-db" || true
          security list-keychains -d user -s "$HOME/Library/Keychains/login.keychain-db" || true
