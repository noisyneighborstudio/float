name: Build and publish updates

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: sparkle-publication
  cancel-in-progress: false

jobs:
  publish:
    # Self-hosted M4 runner (main only — repo is public, never run untrusted PRs on self-hosted)
    runs-on: [self-hosted, macOS, ARM64, float]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # semantic-release and publish-appcast.sh authenticate explicitly.
          persist-credentials: false
      - name: Update local Exact checkout
        env:
          EXACT2: ${{ env.EXACT2 || '/Users/sethwebster/Development/exact2-main' }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$HOME/.bun/bin:$PATH"
          git -C "$EXACT2" -c filter.lfs.process= -c filter.lfs.clean= -c filter.lfs.smudge= -c filter.lfs.required=false fetch origin main
          git -C "$EXACT2" -c filter.lfs.process= -c filter.lfs.clean= -c filter.lfs.smudge= -c filter.lfs.required=false reset --hard origin/main
          (cd "$EXACT2" && bun install --frozen-lockfile)
          echo "EXACT2=$EXACT2" >> "$GITHUB_ENV"
      # GitHub release downloads 504 for minutes at a time; build.sh only fetches Sparkle on a miss.
      - uses: actions/cache@v4
        with:
          path: .vendor
          key: sparkle-${{ hashFiles('updates.env') }}
      - name: Import Developer ID certificate
        env:
          CERTIFICATE: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.BUILD_KEYCHAIN_PASSWORD }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          set -euo pipefail
          for name in CERTIFICATE CERTIFICATE_PASSWORD KEYCHAIN_PASSWORD NOTARY_KEY; do
            [ -n "${!name}" ] || { echo "::error::secret for $name is not set"; exit 1; }
          done
          cert="$RUNNER_TEMP/developer-id.p12"; keychain="$RUNNER_TEMP/float.keychain-db"
          security delete-keychain "$keychain" 2>/dev/null || true
          umask 077; printf '%s' "$CERTIFICATE" | base64 -D > "$cert"
          printf '%s' "$NOTARY_KEY" > "$RUNNER_TEMP/notary.p8"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$cert" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$keychain" >/dev/null
          # Prepend the temporary build keychain while keeping the runner's login keychain intact
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
      - name: Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Only increases. Renaming this file resets it, so don't.
          FLOAT_BUILD_NUMBER: ${{ github.run_number }}
          SIGN: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          NOTARY_KEY_PATH: ${{ runner.temp }}/notary.p8
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_KEY_ISSUER: ${{ secrets.NOTARY_KEY_ISSUER }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$HOME/.bun/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"
          for name in SIGN SPARKLE_PRIVATE_KEY NOTARY_KEY_ID NOTARY_KEY_ISSUER; do
            [ -n "${!name}" ] || { echo "::error::secret for $name is not set"; exit 1; }
          done
          npm ci --no-audit --no-fund
          npx semantic-release
      - name: Remove temporary credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/notary.p8"
          security delete-keychain "$RUNNER_TEMP/float.keychain-db" 2>/dev/null || true
          security list-keychains -d user -s "$HOME/Library/Keychains/login.keychain-db" || true
